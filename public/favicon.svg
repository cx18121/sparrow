<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Sparrow bird silhouette -->
  <!-- Body -->
  <ellipse cx="15" cy="18" rx="7" ry="5" fill="#1460D0"/>
  <!-- Head -->
  <circle cx="22" cy="13" r="4" fill="#1460D0"/>
  <!-- Beak -->
  <polygon points="26,12.5 30,13 26,13.5" fill="#1460D0"/>
  <!-- Tail -->
  <path d="M8 18 Q4 15 3 20 Q6 19 8 21 Q9 19 12 20 Q10 17 8 18Z" fill="#1460D0"/>
  <!-- Wing highlight -->
  <path d="M10 16 Q15 12 20 15" stroke="#6ea8fe" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <!-- Eye -->
  <circle cx="23" cy="12" r="1" fill="white"/>
</svg>
