<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Snowflake icon matching Lucide's Snowflake, color #1460D0 -->
  <!-- Central vertical bar -->
  <line x1="16" y1="4" x2="16" y2="28" stroke="#1460D0" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Central horizontal bar -->
  <line x1="4" y1="16" x2="28" y2="16" stroke="#1460D0" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Diagonal bars -->
  <line x1="7.76" y1="7.76" x2="24.24" y2="24.24" stroke="#1460D0" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="24.24" y1="7.76" x2="7.76" y2="24.24" stroke="#1460D0" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Top branches -->
  <line x1="16" y1="4" x2="13" y2="7" stroke="#1460D0" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="16" y1="4" x2="19" y2="7" stroke="#1460D0" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Bottom branches -->
  <line x1="16" y1="28" x2="13" y2="25" stroke="#1460D0" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="16" y1="28" x2="19" y2="25" stroke="#1460D0" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Left branches -->
  <line x1="4" y1="16" x2="7" y2="13" stroke="#1460D0" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="4" y1="16" x2="7" y2="19" stroke="#1460D0" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Right branches -->
  <line x1="28" y1="16" x2="25" y2="13" stroke="#1460D0" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="28" y1="16" x2="25" y2="19" stroke="#1460D0" stroke-width="2.2" stroke-linecap="round"/>
</svg>
