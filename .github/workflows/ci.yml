name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Type check + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # server/lib/prisma.ts throws at import time when DATABASE_URL is unset.
    # Unit tests mock all routes so no real connection is attempted — a dummy
    # URL just satisfies the import guard.
    env:
      # Various modules throw at import time when these aren't set:
      #   server/lib/prisma.ts  → DATABASE_URL
      #   prisma.config.ts      → DIRECT_URL
      #   src/lib/supabase.ts   → VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
      # Dummy values satisfy the guards without attempting any connection.
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      DIRECT_URL: postgresql://test:test@localhost:5432/test
      VITE_SUPABASE_URL: http://localhost:54321
      VITE_SUPABASE_ANON_KEY: ci-anon-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run check
      - run: npm run test:unit

  build:
    name: Build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same import guard as the verify job — dummy URL is fine, build doesn't connect.
    env:
      # Various modules throw at import time when these aren't set:
      #   server/lib/prisma.ts  → DATABASE_URL
      #   prisma.config.ts      → DIRECT_URL
      #   src/lib/supabase.ts   → VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
      # Dummy values satisfy the guards without attempting any connection.
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      DIRECT_URL: postgresql://test:test@localhost:5432/test
      VITE_SUPABASE_URL: http://localhost:54321
      VITE_SUPABASE_ANON_KEY: ci-anon-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # prebuild runs scripts/check-build-env.ts which short-circuits when
      # VERCEL!=1 — so this only verifies prisma generate + vite build, the
      # same surface Vercel will run after env vars pass.
      - run: npm run build

  secrets:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so gitleaks can scan past commits
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Dummy URL for `prisma generate` (which runs before `supabase start`).
    # Tests themselves load real URLs from `supabase status` via gen-test-env.js.
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      DIRECT_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: npx prisma generate
      # Playwright browsers are versioned per package release; cache by lockfile hash.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # Spin up the local Supabase stack the e2e suite expects. gen-test-env.js
      # reads `supabase status` to derive credentials, so no secrets are needed.
      - run: supabase start
      # Create Prisma-managed tables on the local Supabase DB. The first
      # supabase migration only creates Supabase-managed tables; Prisma tables
      # (Company, Email, etc.) come from `prisma db push`.
      - run: npm run db:push:local
      - run: npm run test:e2e
      # playwright.config.ts uses the 'list' reporter only, so no
      # playwright-report/ HTML directory is produced. test-results/ holds
      # the per-test traces, screenshots, and error contexts — that's what's
      # actually useful to download after a failure.
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
