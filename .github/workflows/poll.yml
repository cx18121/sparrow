name: Monthly data poll

on:
  schedule:
    - cron: "0 6 1 * *"  # 1st of every month at 6am UTC
  workflow_dispatch:       # allow manual trigger from GitHub UI

# Opt JS-based actions into Node 24 ahead of GitHub's 2026-06-02 default
# switch (matches the CI workflow).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Dummy URLs so `prisma generate` can load prisma.config.ts, which
  # resolves env("DIRECT_URL") at config-load time (mirrors ci.yml).
  # generate never connects — it only needs the vars to resolve. The poll
  # step overrides DATABASE_URL with the real secret for the actual ingest;
  # runtime reads DATABASE_URL only (DIRECT_URL is CLI/migration-only).
  DATABASE_URL: postgresql://test:test@localhost:5432/test
  DIRECT_URL: postgresql://test:test@localhost:5432/test

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Prisma 7 no longer auto-generates the client on install, so the
      # client must be generated explicitly before any script imports it
      # (mirrors ci.yml). Without this, scripts/_lib/prisma.ts fails with
      # "@prisma/client does not provide an export named 'PrismaClient'".
      - run: npx prisma generate

      - run: npx tsx scripts/poll.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
